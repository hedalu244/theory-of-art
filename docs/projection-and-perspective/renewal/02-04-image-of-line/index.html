<script>
document.addEventListener('DOMContentLoaded', function() {
  renderMathInElement(document.body, {
    throwOnError: false,
    delimiters: [

      {left: "$", right: "$", display: false},
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ]
  });
});
</script>
