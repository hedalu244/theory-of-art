<body>
<h1>非平面投影</h1>
<main>
<!-- toc disabled -->
<div class="paragraph">
<p>「ガラス板をなぞる方法」は平面のガラス板を想定していました。</p>
</div>
<div class="paragraph">
<p>曲面に投影する
新宿の猫</p>
</div>
<div class="paragraph">
<p>座標幾何には、直交座標に加えてもう一つ、極座標や球面座標などの方法もあります。三次元での極座標は、点の位置を原点からの距離r、方位角（経度）θ、仰角（緯度）φで表します。これを使うと、点の像は、(d cos(θ) tan(φ), d sin(θ) tan(φ))となります。これは、理想カメラが持つ回転対称性を理解するのに適した表現で、非平面投影の理解にもつながります。</p>
</div>
</main>
<script src="/_script/main.js"></script>
